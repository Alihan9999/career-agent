  # Tier 2 — Strong interest (apply when a clear match shows up)
  # =========================================================================

  # DevTools / DevOps platform
  - { name: GitLab,        careers_url: https://about.gitlab.com/jobs/,                   ats: greenhouse, ats_id: gitlab,       tier: 2 }
  - { name: CircleCI,      careers_url: https://circleci.com/careers/,                    ats: greenhouse, ats_id: circleci,     tier: 2 }
  - { name: Confluent,     careers_url: https://www.confluent.io/careers/,                ats: greenhouse, ats_id: confluent,    tier: 2 }
  - { name: Grafana Labs,  careers_url: https://grafana.com/about/careers/,               ats: greenhouse, ats_id: grafanalabs,  tier: 2 }
  - { name: PagerDuty,     careers_url: https://www.pagerduty.com/careers/,               ats: greenhouse, ats_id: pagerduty,    tier: 2 }
  - { name: Tailscale,     careers_url: https://tailscale.com/careers,                    ats: ashby,      ats_id: tailscale,    tier: 2 }
  - { name: Vercel,        careers_url: https://vercel.com/careers,                       ats: ashby,      ats_id: vercel,       tier: 2 }
  - { name: MongoDB,       careers_url: https://www.mongodb.com/careers,                  ats: greenhouse, ats_id: mongodb,      tier: 2 }
  - { name: Sentry,        careers_url: https://sentry.io/careers/,                       ats: greenhouse, ats_id: sentry,       tier: 2 }
