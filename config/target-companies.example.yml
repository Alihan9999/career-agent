# Target Companies Watchlist — Example
#
# Copy this file to config/target-companies.yml and customize.
# target-companies.yml is gitignored — it reveals your job search strategy.
#
# /scan token budget:
#   By default `/scan` only checks Tier 1 companies to keep token usage low.
#   Override per invocation: `/scan tier 2`, `/scan 3`, `/scan all`, or `/scan <Company>`.
#   To raise the default for every run, set scan_tier_limit below.

scan_tier_limit: 1

# Supported ATS platforms (used by `scripts/scrape.py board <ats> <ats_id>`):
#   greenhouse  — JSON API + embed-HTML fallback. ats_id is the board slug.
#   lever       — JSON API. ats_id is the company slug.
#   ashby       — JS-rendered. ats_id is the company slug from jobs.ashbyhq.com/<slug>.
#   workable    — JSON + stealth fallback. ats_id is the account slug.
#   workday     — POST to the tenant's cxs endpoint with Chrome impersonation.
#                 ats_id MUST be the full tenant URL up to the site slug, e.g.
#                 https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   builtin     — Server-rendered. ats_id is the company slug.
#   wellfound   — JS-rendered. ats_id is the company slug.
#   linkedin    — Cloudflare-aware stealth. ats_id is a search query string.
#   indeed      — Cloudflare-aware stealth. ats_id is a search query string.
#   custom      — Auto-escalating fetcher against careers_url. The spider
#                 walks the page for job links; pass careers_url only.
#
# Reliability note:
#   The companies below are the ones that work reliably through /scan.
#   Companies with custom SPA careers sites (FAANG except Netflix, Meta) or
#   that have moved off public ATSs (HashiCorp -> IBM) are listed in the
#   "Manual check" comment block at the bottom — check them in a browser
#   once a week rather than fighting their UIs.

companies:

  # =========================================================================
  # Tier 1 — Dream targets (run pipeline immediately on any match)
  # All entries below are verified to return job listings through /scan.
  # =========================================================================

  # AI labs
  - { name: Anthropic,     careers_url: https://www.anthropic.com/careers,                ats: greenhouse, ats_id: anthropic,    tier: 1 }
  - { name: OpenAI,        careers_url: https://openai.com/careers,                       ats: ashby,      ats_id: openai,       tier: 1 }
  - { name: NVIDIA,        careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite, ats: workday, ats_id: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite", tier: 1 }

  # Infra-first companies
  - { name: Stripe,        careers_url: https://stripe.com/jobs,                          ats: greenhouse, ats_id: stripe,       tier: 1 }
  - { name: Cloudflare,    careers_url: https://www.cloudflare.com/careers/jobs/,         ats: greenhouse, ats_id: cloudflare,   tier: 1 }
  - { name: Datadog,       careers_url: https://www.datadoghq.com/careers/,               ats: greenhouse, ats_id: datadog,      tier: 1 }
  - { name: Databricks,    careers_url: https://www.databricks.com/company/careers,       ats: greenhouse, ats_id: databricks,   tier: 1 }
  - { name: Snowflake,     careers_url: https://careers.snowflake.com/us/en/search-results, ats: custom,                        tier: 1 }
  - { name: Palantir,      careers_url: https://www.palantir.com/careers/,                ats: lever,      ats_id: palantir,     tier: 1 }
  - { name: SpaceX,        careers_url: https://www.spacex.com/careers/,                  ats: greenhouse, ats_id: spacex,       tier: 1 }
