# Target Companies Watchlist
# Copy this file to config/target-companies.yml and fill in your list.
# target-companies.yml is gitignored — it reveals your job search strategy.
#
# Supported ATS platforms (used by `scripts/scrape.py board <ats> <ats_id>`):
#   greenhouse  — JSON API. ats_id is the board slug (e.g. "stripe").
#   lever       — JSON API. ats_id is the company slug.
#   ashby       — JS-rendered. ats_id is the company slug from jobs.ashbyhq.com/<slug>.
#   workable    — JSON + stealth fallback. ats_id is the account slug.
#   workday     — Stealth POST to the tenant's cxs endpoint.
#                 ats_id MUST be the full tenant URL up to the site slug, e.g.
#                 https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   builtin     — Server-rendered. ats_id is the company slug from builtin.com/company/<slug>.
#   wellfound   — JS-rendered. ats_id is the company slug from wellfound.com/company/<slug>.
#   linkedin    — Cloudflare-aware stealth. ats_id is a search query string,
#                 e.g. "keywords=Platform+Engineer&location=United+States&f_TPR=r604800".
#   indeed      — Cloudflare-aware stealth. ats_id is a search query string,
#                 e.g. "q=Platform+Engineer&l=remote&fromage=7".
#   custom      — Auto-escalating fetcher against careers_url. Pass careers_url
#                 directly (no ats_id needed) and the spider will discover job links.

companies:

  # --- Tier 1: Dream targets (apply immediately if match found) ---
  - name: Stripe
    careers_url: https://stripe.com/jobs
    ats: greenhouse
    ats_id: stripe
    tier: 1

  - name: Cloudflare
    careers_url: https://www.cloudflare.com/careers/jobs/
    ats: greenhouse
    ats_id: cloudflare
    tier: 1

  - name: HashiCorp
    careers_url: https://www.hashicorp.com/jobs
    ats: greenhouse
    ats_id: hashicorp
    tier: 1

  - name: Datadog
    careers_url: https://www.datadoghq.com/careers/
    ats: greenhouse
    ats_id: datadog
    tier: 1

  # --- Tier 2: Strong interest ---
  - name: PagerDuty
    careers_url: https://www.pagerduty.com/careers/
    ats: greenhouse
    ats_id: pagerduty
    tier: 2

  - name: Grafana Labs
    careers_url: https://grafana.com/about/careers/
    ats: greenhouse
    ats_id: grafanalabs
    tier: 2

  - name: Wiz
    careers_url: https://www.wiz.io/careers
    ats: greenhouse
    ats_id: wizsecurity
    tier: 2

  - name: Tailscale
    careers_url: https://tailscale.com/careers
    ats: ashby
    ats_id: tailscale
    tier: 2

  # --- Tier 3: Watch but lower priority ---
  - name: Fastly
    careers_url: https://www.fastly.com/about/careers
    ats: greenhouse
    ats_id: fastly
    tier: 3

  - name: Fly.io
    careers_url: https://fly.io/jobs
    ats: custom
    tier: 3

  # --- Examples of the newer board types (uncomment and customize) ---
  # - name: Nvidia
  #   careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
  #   ats: workday
  #   ats_id: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
  #   tier: 2
  #
  # - name: LinkedIn (search-as-a-source, not a single company)
  #   careers_url: https://www.linkedin.com/jobs/search
  #   ats: linkedin
  #   ats_id: "keywords=Platform+Engineer&location=United+States&f_TPR=r604800"
  #   tier: 3
  #
  # - name: Indeed (search-as-a-source)
  #   careers_url: https://www.indeed.com/jobs
  #   ats: indeed
  #   ats_id: "q=Platform+Engineer&l=remote&fromage=7"
  #   tier: 3

# Role filters — applied across all companies
filters:
  # Jobs must contain at least one include keyword (case-insensitive)
  include_keywords:
    - DevOps
    - SRE
    - Site Reliability
    - Platform Engineer
    - Infrastructure Engineer
    - Cloud Engineer
    - Production Engineer
    - Reliability Engineer

  # Jobs are skipped if they contain any exclude keyword
  exclude_keywords:
    - Staff
    - Principal
    - Director
    - Manager
    - VP
    - Data Scientist
    - Data Engineer
    - Frontend
    - Backend Engineer
    - Full Stack
    - Mobile
    - Sales
    - Marketing
    - Recruiter

  # Minimum confidence score to include in report (0-100)
  min_score: 60

  # Location requirements — roles not matching are excluded entirely before scoring
  remote_only: true      # skip any role that is not explicitly remote or has a required office location
  location: US           # skip roles located outside the US (EU, APAC, etc.) or with no US remote option
