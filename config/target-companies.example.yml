# =============================================================================
# Manual-check companies (NOT scanned by /scan)
#
# These companies don't have a public ATS endpoint we can scrape reliably,
# either because their careers UI is a custom SPA (FAANG except Netflix) or
# because they've moved off public ATSs since being acquired. Check them in
# a browser once a week rather than fighting their UIs from the spider.
#
# To enable any of them, uncomment and accept the limitation (mostly: noisy
# results, hundreds of irrelevant roles that filters have to discard).
# =============================================================================
#
# - { name: Google,        careers_url: https://www.google.com/about/careers/applications, ats: custom, tier: 1 }
#     # Custom React SPA with paginated search. Spider extracts links but the
#     # default page shows ~20 results; pagination buttons don't trigger via scroll.
#
# - { name: Apple,         careers_url: https://jobs.apple.com/en-us/search,               ats: custom, tier: 1 }
#     # Custom React SPA, paginated. Same caveat as Google.
#
# - { name: Amazon,        careers_url: "https://www.amazon.jobs/en/search?base_query=site+reliability+OR+platform+engineer+OR+devops&country%5B%5D=USA", ats: custom, tier: 1 }
#     # Server-side filtered URL works, but URL filters can't enforce role-type
#     # exactly; expect retail/warehouse noise that include_keywords must filter.
#
# - { name: Microsoft,     careers_url: https://jobs.careers.microsoft.com/,               ats: custom, tier: 1 }
#     # Custom SPA. Returns initial page only; doesn't paginate.
#
# - { name: Meta,          careers_url: https://www.metacareers.com/jobs,                  ats: custom, tier: 1 }
#     # Uses GraphQL with rotating persisted query IDs; data is not in the
#     # initial HTML and the spider can't extract <a> links. Manual check only.
#
# - { name: Netflix,       careers_url: https://jobs.netflix.com/,                         ats: custom, tier: 1 }
#     # SPA with infinite scroll. The custom spider scrolls but content depth
#     # is unreliable; treat results as a sample, not exhaustive.
#
# - { name: HashiCorp,     careers_url: https://www.hashicorp.com/jobs,                    ats: greenhouse, ats_id: hashicorp, tier: 1 }
#     # Acquired by IBM in 2025; their public Greenhouse board is gone and
#     # IBM's portal needs auth. No reliable scrape path. Check manually.


# Role filters — applied across all companies.
filters:
  # Jobs must contain at least one include keyword (case-insensitive).
  include_keywords:
    - DevOps
    - SRE
    - Site Reliability
    - Platform Engineer
    - Platform Engineering
    - Infrastructure Engineer
    - Cloud Engineer
    - Production Engineer
    - Reliability Engineer
    - Systems Engineer
    - Kubernetes
    - Observability

  # Jobs are skipped if they contain any exclude keyword.
  exclude_keywords:
    - Staff
    - Principal
    - Director
    - Manager
    - VP
    - Head of
    - Lead
    - Data Scientist
    - Data Engineer
    - ML Engineer
    - Machine Learning
    - Frontend
    - Front End
    - Full Stack
    - iOS
    - Android
    - Mobile
    - Sales
    - Marketing
    - Recruiter
    - Customer
    - Support
    - Intern

  # Minimum confidence score to include in report (0-100).
  min_score: 60

  # Location — roles outside US are excluded entirely before scoring.
  remote_only: true
  location: US
